title = "codebase-city gitleaks config"

[extend]
useDefault = true

# Blocks local device paths in committed files. Patterns live only here, never in docs.
# Regex backslashes are doubled: a single backslash would escape the next character.
[[rules]]
id = "local-device-path"
description = "Local device path (drive-letter path under a Users folder, either slash style)"
regex = '''(?i)(?:[a-z]:\\{1,2}users\\{1,2}|[a-z]:/users/|(?:^|[\s"'=(])/[a-z]/users/)'''
keywords = ["users"]
tags = ["privacy"]

# The gallery JSON holds 12-character pseudonymous author keys (hash prefixes) that the generic-api-key rule
# mistakes for secrets. Checked by hand when the gallery is rebuilt: no emails, no device paths.
[allowlist]
paths = ['''^public/gallery/.*\.json$''', '''^\.gitleaks\.toml$''', '''^package-lock\.json$''']
